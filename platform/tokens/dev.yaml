version: "1.0.0"
environment: "dev"
aws_region: "eu-west-1"

# 1. NETWORK & TOPOLOGY
network:
  vpc_id: "vpc-0111111111dev0000"
  subnets:
    public:
      - "subnet-0devpub1a"
      - "subnet-0devpub1b"
    private_app:
      - "subnet-0devapp1a"
      - "subnet-0devapp1b"
    isolated_db:
      - "subnet-0devdata1a"
      - "subnet-0devdata1b"

# 2. SECURITY & ENCRYPTION
security:
  kms_keys:
    # In dev si usa una chiave KMS condivisa o default per ridurre i costi fissi
    storage_key_arn: "arn:aws:kms:eu-west-1:111122223333:key/dev-shared-storage-key"
    database_key_arn: "arn:aws:kms:eu-west-1:111122223333:key/dev-shared-db-key"
  tls_policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
  enable_deletion_protection: false

# 3. COMPUTE SIZING & RUNTIME (ECS FARGATE)
compute:
  fargate_profiles:
    small:
      cpu: "256"      # 0.25 vCPU
      memory: "512"   # 512 MB
    medium:
      cpu: "512"
      memory: "1024"
    large:
      cpu: "1024"
      memory: "2048"
  desired_count: 1
  assign_public_ip: false

# 4. STORAGE & PERSISTENCE
storage:
  s3:
    force_destroy: true
    versioning_status: "Suspended"
    audit_log_target_bucket: "acme-dev-centralized-access-logs"
  dynamodb:
    billing_mode: "PAY_PER_REQUEST"
    point_in_time_recovery: false

# 5. GOVERNANCE & NAMING
governance:
  naming_mask: "acme-dev-{service_name}-{resource_suffix}"
  default_tags:
    Organization: "AcmeCorp"
    Environment: "dev"
    ManagedBy: "Kiro-IaI"
    CostCenter: "Fleet-Engineering-Dev"
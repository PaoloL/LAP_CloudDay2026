version: "1.0.0"
environment: "prod"
aws_region: "eu-west-1"

# 1. NETWORK & TOPOLOGY
network:
  vpc_id: "vpc-0999999999prod000"
  subnets:
    public:
      - "subnet-0prodpub1a"
      - "subnet-0prodpub1b"
      - "subnet-0prodpub1c"
    private_app:
      - "subnet-0prodapp1a"
      - "subnet-0prodapp1b"
      - "subnet-0prodapp1c"
    isolated_db:
      - "subnet-0proddata1a"
      - "subnet-0proddata1b"
      - "subnet-0proddata1c"

# 2. SECURITY & ENCRYPTION (Strict PCI-DSS / CIS Benchmark)
security:
  kms_keys:
    # Customer Managed Keys (CMK) dedicate con rotazione annuale
    storage_key_arn: "arn:aws:kms:eu-west-1:444455556666:key/prod-pci-storage-cmk"
    database_key_arn: "arn:aws:kms:eu-west-1:444455556666:key/prod-pci-database-cmk"
  tls_policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
  enable_deletion_protection: true

# 3. COMPUTE SIZING & RUNTIME (ECS FARGATE)
compute:
  fargate_profiles:
    small:
      cpu: "512"      # 0.5 vCPU (garantito minimo per prod)
      memory: "1024"  # 1 GB
    medium:
      cpu: "1024"
      memory: "2048"
    large:
      cpu: "2048"
      memory: "4096"
  desired_count: 2    # Minimo 2 istanze per HA
  assign_public_ip: false

# 4. STORAGE & PERSISTENCE
storage:
  s3:
    force_destroy: false
    versioning_status: "Enabled"
    audit_log_target_bucket: "acme-prod-security-audit-logs"
  dynamodb:
    billing_mode: "PAY_PER_REQUEST"
    point_in_time_recovery: true

# 5. GOVERNANCE & NAMING
governance:
  naming_mask: "acme-prod-{service_name}-{resource_suffix}"
  default_tags:
    Organization: "AcmeCorp"
    Environment: "prod"
    ManagedBy: "Kiro-IaI"
    CostCenter: "Fleet-Core-Prod"
    ComplianceScope: "pci-dss"